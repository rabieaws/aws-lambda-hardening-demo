service: media-pipeline

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  memorySize: 1024
  environment:
    LOG_LEVEL: INFO
    STAGE: ${self:provider.stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: !Sub '${MediaBucket.Arn}/*'
        - Effect: Allow
          Action:
            - mediaconvert:CreateJob
            - cloudfront:CreateInvalidation
          Resource: '*'

package:
  individually: true

functions:

  thumbnailRenderer:
    handler: thumbnail_renderer.lambda_handler
    package:
      patterns:
        - '../functions/media/thumbnail_renderer.py'
    events:
      - s3:
          bucket: !Ref MediaBucket
          event: s3:ObjectCreated:*
          existing: true

  transcodeLauncher:
    handler: transcode_launcher.lambda_handler
    memorySize: 1536
    environment:
      MEDIACONVERT_ROLE: ${env:MEDIACONVERT_ROLE, ''}
      MEDIACONVERT_QUEUE: ${env:MEDIACONVERT_QUEUE, ''}
    package:
      patterns:
        - '../functions/media/transcode_launcher.py'
    events:
      - s3:
          bucket: !Ref MediaBucket
          event: s3:ObjectCreated:*
          existing: true

  metadataSidecar:
    handler: metadata_sidecar.lambda_handler
    package:
      patterns:
        - '../functions/media/metadata_sidecar.py'
    events:
      - s3:
          bucket: !Ref MediaBucket
          event: s3:ObjectCreated:*
          existing: true

  waveformExtractor:
    handler: waveform_extractor.lambda_handler
    timeout: 900
    memorySize: 2048
    package:
      patterns:
        - '../functions/media/waveform_extractor.py'
    events:
      - s3:
          bucket: !Ref MediaBucket
          event: s3:ObjectCreated:*
          existing: true

  cdnInvalidator:
    handler: cdn_invalidator.lambda_handler
    environment:
      DISTRIBUTION_ID: ${env:DISTRIBUTION_ID, ''}
    package:
      patterns:
        - '../functions/media/cdn_invalidator.py'
    events:
      - s3:
          bucket: !Ref MediaBucket
          event: s3:ObjectCreated:*
          existing: true

resources:
  Resources:

    MediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: media-assets-${self:provider.stage}
        VersioningConfiguration:
          Status: Enabled
