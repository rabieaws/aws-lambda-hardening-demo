AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Commerce order and billing stack

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        LOG_LEVEL: INFO
        STAGE: !Ref Stage

Parameters:
  Stage:
    Type: String
    Default: prod

Resources:

  # ---------------------------------------------------------------------------
  # orders/  -- packaging root is ../functions/orders
  # ---------------------------------------------------------------------------

  CheckoutSubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/orders
      Handler: checkout_submit.lambda_handler
      Runtime: python3.9
      Environment:
        Variables:
          ORDER_TABLE: !Ref OrderTable
          CATALOG_TABLE: !Ref CatalogTable
          FULFILMENT_QUEUE_URL: !Ref FulfilmentQueue
      Events:
        Post:
          Type: Api
          Properties:
            Path: /checkout
            Method: post

  CartPricingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/orders
      Handler: cart_pricing.lambda_handler
      Runtime: python3.9
      Environment:
        Variables:
          PROMOTION_TABLE: !Ref PromotionTable
      Events:
        Post:
          Type: Api
          Properties:
            Path: /cart/price
            Method: post

  OrderSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/orders
      Handler: order_search.lambda_handler
      Environment:
        Variables:
          ORDER_TABLE: !Ref OrderTable
      Events:
        Get:
          Type: Api
          Properties:
            Path: /orders
            Method: get

  OrderStatusStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/orders
      Handler: order_status_stream.lambda_handler
      Environment:
        Variables:
          NOTIFICATION_TOPIC_ARN: !Ref OrderNotificationTopic
      Events:
        OrderStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt OrderTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 1000

  InventoryAllocatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/orders
      Handler: inventory_allocator.lambda_handler
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTable
          RESERVATION_TABLE: !Ref ReservationTable

  OrderArchiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/orders
      Handler: order_archiver.lambda_handler
      Timeout: 900
      MemorySize: 3008
      Environment:
        Variables:
          ORDER_TABLE: !Ref OrderTable
          ARCHIVE_BUCKET: !Ref ArchiveBucket
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 * * ? *)

  # ---------------------------------------------------------------------------
  # billing/  -- packaging root is ../functions/billing
  # ---------------------------------------------------------------------------

  InvoiceGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/billing
      Handler: invoice_generator.lambda_handler
      Environment:
        Variables:
          INVOICE_TABLE: !Ref InvoiceTable
          SUBSCRIPTION_TABLE: !Ref SubscriptionTable
      Events:
        InvoiceRequests:
          Type: SQS
          Properties:
            Queue: !GetAtt InvoiceQueue.Arn
            BatchSize: 10

  PaymentCaptureFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/billing
      Handler: payment_capture.lambda_handler
      Environment:
        Variables:
          CAPTURE_TABLE: !Ref CaptureTable
          AUTHORIZATION_TABLE: !Ref AuthorizationTable
      Events:
        CaptureRequests:
          Type: SQS
          Properties:
            Queue: !GetAtt CaptureQueue.Arn
            BatchSize: 10

  LedgerPosterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/billing
      Handler: ledger_poster.lambda_handler
      Environment:
        Variables:
          JOURNAL_TABLE: !Ref JournalTable
          ACCOUNT_TABLE: !Ref AccountTable
      Events:
        JournalEntries:
          Type: SQS
          Properties:
            Queue: !GetAtt LedgerQueue.Arn
            BatchSize: 10

  DunningSchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/billing
      Handler: dunning_scheduler.lambda_handler
      Environment:
        Variables:
          INVOICE_TABLE: !Ref InvoiceTable
          DUNNING_QUEUE_URL: !Ref DunningQueue
      Events:
        DunningSteps:
          Type: SQS
          Properties:
            Queue: !GetAtt DunningQueue.Arn
            BatchSize: 10

  RefundDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/billing
      Handler: refund_dispatcher.lambda_handler
      Environment:
        Variables:
          REFUND_TABLE: !Ref RefundTable
          CAPTURE_TABLE: !Ref CaptureTable
          LEDGER_QUEUE_URL: !Ref LedgerQueue
      Events:
        RefundRequests:
          Type: SQS
          Properties:
            Queue: !GetAtt RefundQueue.Arn
            BatchSize: 10

  # ---------------------------------------------------------------------------
  # Data stores
  # ---------------------------------------------------------------------------

  OrderTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'orders-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: submitted_at
          AttributeType: N
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-customer-submitted
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
            - AttributeName: submitted_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'catalog-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sku
          AttributeType: S
      KeySchema:
        - AttributeName: sku
          KeyType: HASH

  PromotionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'promotions-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: promotion_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: priority
          AttributeType: N
      KeySchema:
        - AttributeName: promotion_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-status-priority
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: priority
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'inventory-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sku
          AttributeType: S
        - AttributeName: warehouse_id
          AttributeType: S
      KeySchema:
        - AttributeName: sku
          KeyType: HASH
        - AttributeName: warehouse_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-sku
          KeySchema:
            - AttributeName: sku
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ReservationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'reservations-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reservation_id
          AttributeType: S
      KeySchema:
        - AttributeName: reservation_id
          KeyType: HASH

  InvoiceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'invoices-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: invoice_id
          AttributeType: S
      KeySchema:
        - AttributeName: invoice_id
          KeyType: HASH

  SubscriptionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'subscriptions-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscription_id
          AttributeType: S
      KeySchema:
        - AttributeName: subscription_id
          KeyType: HASH

  CaptureTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'captures-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: capture_id
          AttributeType: S
        - AttributeName: psp_reference
          AttributeType: S
      KeySchema:
        - AttributeName: capture_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-psp-reference
          KeySchema:
            - AttributeName: psp_reference
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  AuthorizationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'authorizations-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: authorization_id
          AttributeType: S
      KeySchema:
        - AttributeName: authorization_id
          KeyType: HASH

  JournalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'journal-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: entry_id
          AttributeType: S
        - AttributeName: line_number
          AttributeType: N
        - AttributeName: account_code
          AttributeType: S
        - AttributeName: posted_at
          AttributeType: N
      KeySchema:
        - AttributeName: entry_id
          KeyType: HASH
        - AttributeName: line_number
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by-account-posted
          KeySchema:
            - AttributeName: account_code
              KeyType: HASH
            - AttributeName: posted_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AccountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'chart-of-accounts-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: account_code
          AttributeType: S
      KeySchema:
        - AttributeName: account_code
          KeyType: HASH

  RefundTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'refunds-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: refund_id
          AttributeType: S
        - AttributeName: capture_id
          AttributeType: S
      KeySchema:
        - AttributeName: refund_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-capture
          KeySchema:
            - AttributeName: capture_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ---------------------------------------------------------------------------
  # Queues and topics
  # ---------------------------------------------------------------------------

  FulfilmentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'fulfilment-${Stage}'
      VisibilityTimeout: 300

  InvoiceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'invoice-requests-${Stage}'
      VisibilityTimeout: 300

  CaptureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'capture-requests-${Stage}'
      VisibilityTimeout: 300

  LedgerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'journal-entries-${Stage}'
      VisibilityTimeout: 300

  DunningQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'dunning-${Stage}'
      VisibilityTimeout: 300

  RefundQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'refund-requests-${Stage}'
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RefundQueue.Arn
        maxReceiveCount: 5

  OrderNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'order-notifications-${Stage}'

  ArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'order-archive-${Stage}-${AWS::AccountId}'

Outputs:
  ApiEndpoint:
    Description: Commerce API base URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
